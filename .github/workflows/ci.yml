name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libinput-dev libudev-dev libxkbcommon-dev libseat-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxi-dev \
            fonts-noto-core shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features screenshot -- -D warnings
      - name: Tests
        run: cargo test --workspace --features screenshot
      - name: Kiosk build (DRM/KMS backend)
        run: cargo check -p hada --no-default-features --features kiosk
      - name: Release feature set (window + kiosk)
        run: cargo check -p hada --no-default-features --features window,kiosk
      - name: Shell scripts
        run: shellcheck deploy/install-kiosk.sh scripts/*.sh
      - name: Screenshots of the demo dashboard
        run: scripts/screenshots.sh screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/*.png

  # The Android app: the release APK for phones and tablets (arm64 + armv7, signed
  # with a throwaway key), then an x86_64 build that an Android 8.0 emulator must
  # start without crashing. Skia has no prebuilt armv7 library, so the first run
  # builds it from source; the cache (shared with the release workflow) keeps it.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: JDK 17 and a throwaway signing key
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android \
            -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=hada CI" -noprompt
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
      - name: APK for phones and tablets (arm64 + armv7)
        run: |
          scripts/build-apk.sh --release
          mkdir -p apk && cp target/release/apk/hada.apk apk/hada.apk && ls -l apk
      - name: Manifest of the APK
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging apk/hada.apk | tee badging.txt
          grep -q "sdkVersion:'26'" badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt
          grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" badging.txt
          "$AAPT" dump xmltree apk/hada.apk AndroidManifest.xml | grep -q "android.intent.category.HOME"
      - uses: actions/upload-artifact@v7
        with:
          name: hada-apk-ci-signed
          path: apk/hada.apk
      - name: APK for the emulator (x86_64)
        run: scripts/build-apk.sh --release --target x86_64-linux-android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start on an Android 8.0 (API 26) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: scripts/android-smoke-test.sh target/release/apk/hada.apk android-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke
          path: android-smoke/

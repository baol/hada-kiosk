name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libinput-dev libudev-dev libxkbcommon-dev libseat-dev \
            libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxi-dev \
            fonts-noto-core shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features screenshot -- -D warnings
      - name: Tests
        run: cargo test --workspace --features screenshot
      - name: Kiosk build (DRM/KMS backend)
        run: cargo check -p hada --no-default-features --features kiosk
      - name: Release feature set (window + kiosk)
        run: cargo check -p hada --no-default-features --features window,kiosk
      - name: Shell scripts
        run: shellcheck deploy/install-kiosk.sh scripts/*.sh
      - name: Screenshots of the demo dashboard
        run: scripts/screenshots.sh screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/*.png

  # The Android app (Android 5.0+): build the APK for phones and tablets (arm64 +
  # armv7, throwaway key) and check its manifest.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: APK for phones and tablets (arm64 + armv7)
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          scripts/build-apk.sh
      - name: Manifest of the APK
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          "$AAPT" dump badging target/android/hada.apk | tee badging.txt
          grep -q "sdkVersion:'21'" badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt
          grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" badging.txt
          "$AAPT" dump xmltree target/android/hada.apk AndroidManifest.xml > manifest.txt
          grep -q "android.intent.category.HOME" manifest.txt
          grep -q "io.github.baol.hada.PrefsActivity" manifest.txt
          grep -q "io.github.baol.hada.BootReceiver" manifest.txt
      - uses: actions/upload-artifact@v7
        with:
          name: hada-apk-test-key
          path: target/android/hada.apk

  # First start on emulators: Android 5.1 (API 22, like Fire OS 5) and Android 11.
  android-emulator:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [22, 30]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-x86_64
      - name: APK for the emulator (x86_64)
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          scripts/build-apk.sh --target x86_64-linux-android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: First start on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: scripts/android-smoke-test.sh target/android/hada.apk android-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-api${{ matrix.api }}
          path: android-smoke/

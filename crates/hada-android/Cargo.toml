[package]
name = "hada-android"
description = "hada as an Android app (Android 5.0+), packaged by scripts/build-apk.sh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
hada = { path = "../hada", default-features = false }
hada-core = { path = "../hada-core" }
tracing.workspace = true

# No Slint Android backend: it draws with Skia, which needs Android 8.0. The
# software renderer (as on the Raspberry Pi) draws into the window instead.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18", "renderer-software", "software-renderer-systemfonts"] }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = { version = "0.9", default-features = false }   # not "nativewindow": libnativewindow.so is Android 8+
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
jni = "0.22"

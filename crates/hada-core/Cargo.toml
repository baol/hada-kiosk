[package]
name = "hada-core"
description = "Lovelace model, Home Assistant websocket client and domain rules for hada"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
url.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
# Local UTC offset for forecast labels (already in the tree through Slint).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Album art (JPEG/PNG/WebP), already in the tree through Slint.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

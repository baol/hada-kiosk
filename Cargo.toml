[workspace]
resolver = "2"
members = ["crates/hada-core", "crates/hada", "crates/hada-android"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
thiserror = "2"
tracing = "0.1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
